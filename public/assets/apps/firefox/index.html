<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Firefox</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #17191c; }
    #screen { display: none; border: 1px solid #343941; image-rendering: pixelated; background: #fff; outline: none; }
    #screen.ready { display: block; }
    #splash {
      min-height: 100vh;
      display: grid;
      place-items: center;
      box-sizing: border-box;
    }
    #splash.done { display: none; }
    .progress-track {
      width: min(360px, calc(100vw - 48px));
      height: 8px;
      overflow: hidden;
      background: #2d333b;
      border-radius: 999px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #6bd1ff;
      border-radius: inherit;
      transition: width 120ms ease;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-ee482ddd.js"></script>
</head>
<body>
  <section id="splash" aria-label="Loading Firefox">
    <div
      class="progress-track"
      role="progressbar"
      aria-label="Loading Firefox"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div id="progress-fill" class="progress-fill"></div>
    </div>
  </section>
  <canvas id="screen" width="1024" height="768" tabindex="0"></canvas>
</body>
</html>
